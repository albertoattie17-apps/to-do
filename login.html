<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Bitácora del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --paper: #F3F5F2; --sheet: #FFFFFF; --ink: #18211D; --muted: #5E6B64; --line: #DCE2DD;
  --accent: #1F6F55; --danger: #B3362E;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #111614; --sheet: #182019; --ink: #E6ECE8; --muted: #95A39B; --line: #2A3530; --accent: #5CC59C; --danger: #F0776E; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
form { width: 100%; max-width: 360px; background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1.05; margin: 2px 0 0; }
h1 span { color: var(--accent); }
.lead { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
input { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--sheet); border: 0; border-radius: 10px; height: 44px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.hint { font-size: 12px; color: var(--muted); margin: -8px 0 0; }
.error { color: var(--danger); font-size: 14px; margin: 0; }
button.link { background: none; color: var(--muted); height: auto; font-weight: 500; font-size: 13px; text-decoration: underline; padding: 0; justify-self: center; }
button.link:hover { color: var(--ink); }
</style>
</head>
<body>
<form id="f" novalidate>
  <div>
    <div class="eyebrow" id="eyebrow">Acceso privado</div>
    <h1><span>Bitácora</span> del Día</h1>
  </div>
  <p class="lead" id="lead">Cargando…</p>
  <p class="error" id="err" hidden></p>
  <label id="codeRow" hidden>Código de recuperación
    <input id="code" autocomplete="off">
  </label>
  <label id="userRow">Usuario
    <input id="username" name="username" autocomplete="username" minlength="4" maxlength="60" required>
  </label>
  <label><span id="passLabel">Contraseña</span>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="4" required>
  </label>
  <label id="confirmRow" hidden>Repite la contraseña
    <input id="confirm" type="password" autocomplete="new-password" minlength="4">
  </label>
  <p class="hint">Mínimo 4 caracteres (letras o números) en cada campo.</p>
  <button type="submit" id="go" disabled>Entrar</button>
  <button type="button" class="link" id="forgot" hidden>¿Olvidaste tu contraseña?</button>
</form>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  let mode = "login";
  const showError = (t) => { $("err").textContent = t; $("err").hidden = !t; };

  try {
    const s = await (await fetch("/api/session", { cache: "no-store" })).json();
    if (!s.ready) { $("lead").textContent = s.reason || "El acceso todavía no está configurado."; return; }
    if (s.loggedIn) { location.replace("/"); return; }
    if (!s.hasUser) {
      mode = "signup";
      $("eyebrow").textContent = "Primera vez";
      $("lead").textContent = "Crea tu usuario y contraseña. Solo se puede crear una cuenta: después el sitio queda cerrado para cualquier otra persona.";
      $("confirmRow").hidden = false;
      $("password").autocomplete = "new-password";
      $("go").textContent = "Crear cuenta";
    } else {
      $("lead").textContent = "Entra con tu usuario y contraseña.";
      $("forgot").hidden = false;
    }
    $("go").disabled = false;
    $("username").focus();
  } catch {
    $("lead").textContent = "No se pudo conectar. Recarga la página.";
    return;
  }

  function setReset(on) {
    mode = on ? "reset" : "login";
    showError("");
    $("eyebrow").textContent = on ? "Recuperar acceso" : "Acceso privado";
    $("lead").textContent = on
      ? "Escribe el código de recuperación que guardaste en Vercel (RESET_CODE) y tu contraseña nueva. Tus tareas no cambian."
      : "Entra con tu usuario y contraseña.";
    $("codeRow").hidden = !on;
    $("userRow").hidden = on;
    $("confirmRow").hidden = !on;
    $("passLabel").textContent = on ? "Contraseña nueva" : "Contraseña";
    $("password").autocomplete = on ? "new-password" : "current-password";
    $("go").textContent = on ? "Cambiar contraseña" : "Entrar";
    $("forgot").textContent = on ? "Volver a entrar" : "¿Olvidaste tu contraseña?";
    (on ? $("code") : $("username")).focus();
  }
  $("forgot").addEventListener("click", () => setReset(mode !== "reset"));

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (mode === "reset") {
      const code = $("code").value.trim(), password = $("password").value;
      if (!code) return showError("Escribe tu código de recuperación.");
      if (password.length < 4) return showError("La contraseña nueva necesita mínimo 4 caracteres.");
      if (password !== $("confirm").value) return showError("Las contraseñas no coinciden.");
      showError(""); $("go").disabled = true;
      try {
        const r = await fetch("/api/reset", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code, password }) });
        const d = await r.json();
        if (r.ok) {
          $("lead").textContent = `Listo, contraseña cambiada. Tu usuario es "${d.username}". Entrando…`;
          setTimeout(() => location.replace("/"), 2500);
          return;
        }
        showError(d.error || "No se pudo cambiar la contraseña.");
      } catch { showError("No se pudo conectar. Intenta de nuevo."); }
      $("go").disabled = false;
      return;
    }
    const username = $("username").value.trim(), password = $("password").value;
    if (username.length < 4 || password.length < 4) return showError("Usuario y contraseña necesitan mínimo 4 caracteres.");
    if (mode === "signup" && password !== $("confirm").value) return showError("Las contraseñas no coinciden.");
    showError(""); $("go").disabled = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode, username, password }) });
      const d = await r.json();
      if (r.ok) { location.replace("/"); return; }
      showError(d.error || "No se pudo entrar.");
    } catch { showError("No se pudo conectar. Intenta de nuevo."); }
    $("go").disabled = false;
  });
})();
</script>
</body>
</html>
