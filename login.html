<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Bitácora del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --paper: #F3F5F2; --sheet: #FFFFFF; --ink: #18211D; --muted: #5E6B64; --line: #DCE2DD;
  --accent: #1F6F55; --danger: #B3362E;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #111614; --sheet: #182019; --ink: #E6ECE8; --muted: #95A39B; --line: #2A3530; --accent: #5CC59C; --danger: #F0776E; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
form { width: 100%; max-width: 360px; background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1.05; margin: 2px 0 0; }
h1 span { color: var(--accent); }
.lead { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
input { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--sheet); border: 0; border-radius: 10px; height: 44px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.hint { font-size: 12px; color: var(--muted); margin: -8px 0 0; }
.error { color: var(--danger); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<form id="f" novalidate>
  <div>
    <div class="eyebrow">Acceso privado</div>
    <h1><span>Bitácora</span> del Día</h1>
  </div>
  <p class="lead" id="lead">Cargando…</p>
  <p class="error" id="err" hidden></p>
  <label>Usuario o correo
    <input id="username" name="username" autocomplete="username" minlength="4" maxlength="120" required>
  </label>
  <label>Contraseña
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="4" required>
  </label>
  <p class="hint">Los usuarios se crean y se cambian en Supabase → Authentication → Users.</p>
  <button type="submit" id="go" disabled>Entrar</button>
</form>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const showError = (t) => { $("err").textContent = t; $("err").hidden = !t; };

  try {
    const s = await (await fetch("/api/session", { cache: "no-store" })).json();
    if (!s.ready) { $("lead").textContent = s.reason || "El acceso todavía no está configurado."; return; }
    if (s.loggedIn) { location.replace("/"); return; }
    $("lead").textContent = "Entra con tu usuario y contraseña.";
    $("go").disabled = false;
    $("username").focus();
  } catch {
    $("lead").textContent = "No se pudo conectar. Recarga la página.";
    return;
  }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = $("username").value.trim(), password = $("password").value;
    if (username.length < 4 || password.length < 4) return showError("Usuario y contraseña necesitan mínimo 4 caracteres.");
    showError(""); $("go").disabled = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
      const d = await r.json();
      if (r.ok) { location.replace("/"); return; }
      showError(d.error || "No se pudo entrar.");
    } catch { showError("No se pudo conectar. Intenta de nuevo."); }
    $("go").disabled = false;
  });
})();
</script>
</body>
</html>
